<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AudiOptix, an evolving music visualizer</title>
<meta name="description" content="A browser music player with a live audio-spectrum visualizer. Drop in your own MP3s, pick a theme, tune the bars. No uploads, no accounts, and your files never leave your device."/>
<link rel="canonical" href="https://kiarashfa.github.io/audioptix/"/>

<!-- Tab icon. The useFavicon hook in player.jsx swaps this link's href for a live
     canvas (animated bars while playing); favicon.svg is what shows until then. -->
<link rel="icon" href="favicon/favicon.ico" sizes="32x32"/>
<link id="favicon" rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<!-- Single tag, kept in step with the theme picker from player.jsx. Matches
     site.webmanifest theme_color and THEMES.noir.bg, the default theme. -->
<meta name="theme-color" content="#0a0907"/>

<meta property="og:type" content="website"/>
<meta property="og:site_name" content="AudiOptix"/>
<meta property="og:url" content="https://kiarashfa.github.io/audioptix/"/>
<meta property="og:title" content="AudiOptix, an evolving music visualizer"/>
<meta property="og:description" content="A browser music player with a live audio-spectrum visualizer. Drop in your own MP3s, pick a theme, tune the bars. No uploads, no accounts, and your files never leave your device."/>
<meta property="og:image" content="https://kiarashfa.github.io/audioptix/src/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="The AudiOptix wordmark above a row of audio spectrum bars"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="AudiOptix, an evolving music visualizer"/>
<meta name="twitter:description" content="A browser music player with a live audio-spectrum visualizer. Drop in your own MP3s, pick a theme, tune the bars. No uploads, no accounts, and your files never leave your device."/>
<meta name="twitter:image" content="https://kiarashfa.github.io/audioptix/src/og.png"/>

<!-- Self-hosted fonts: no third-party font requests. See tools/fetch-fonts.mjs. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/jetbrains-mono/jetbrains-mono-400-normal-latin.woff2" crossorigin/>
<link rel="preload" as="font" type="font/woff2" href="fonts/cormorant-garamond/cormorant-garamond-500-italic-latin.woff2" crossorigin/>
<link rel="stylesheet" href="fonts/fonts.css"/>

<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body, #root {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    background: #0a0907;
    color: #f4ede0;
  }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .ambient {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  /* ── Layout: left drawer + card + right drawer ─── */
  .layout {
    position: relative; z-index: 2;
    display: flex; align-items: stretch; gap: 14px;
    width: min(1200px, 96vw);
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .stage.dragging { cursor: copy; }
  .drop-overlay {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    font-size: 14px;
  }

  /* ── Card ───────────────────────────────────── */
  .card {
    flex: 1;
    position: relative;
    padding: 24px 26px 22px;
    min-width: 0;
  }
  .card-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card-top {
    display: grid;
    grid-template-columns: 160px 1fr auto;
    gap: 22px;
    align-items: center;
  }
  @media (max-width: 760px) {
    .card-top { grid-template-columns: 1fr; gap: 16px; text-align: center; }
  }

  .card-toggles {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; gap: 4px;
    z-index: 3;
  }
  .icon-btn {
    width: 32px; height: 32px;
    appearance: none; border: 0; background: transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    transition: color 0.2s, transform 0.5s, background 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); }
  .icon-btn.rotate:hover { transform: rotate(45deg); }

  /* Right corner: track index + mini wave */
  .card-corner {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 8px; min-width: 100px;
    padding-right: 36px;
  }
  @media (max-width: 760px) { .card-corner { display: none; } }
  .track-index {
    display: flex; align-items: baseline; gap: 4px;
    line-height: 1;
  }
  .ti-num { font-size: 38px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ti-sep { font-size: 22px; }
  .ti-total { font-size: 12px; letter-spacing: 0.1em; }
  .ti-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .mini-wave {
    display: flex; align-items: flex-end; gap: 2px;
    height: 22px; width: 92px;
  }
  .mini-wave span {
    flex: 1; border-radius: 1px;
    animation: mwave 1.2s ease-in-out infinite alternate;
  }
  @keyframes mwave {
    0% { transform: scaleY(0.45); }
    100% { transform: scaleY(1); }
  }

  .cover-wrap { display: flex; flex-direction: column; gap: 12px; }
  .cover {
    width: 160px; height: 160px;
    overflow: hidden;
    position: relative;
  }
  @media (max-width: 720px) {
    .cover { width: 200px; height: 200px; margin: 0 auto; }
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  .np-tag {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .np-dot {
    width: 6px; height: 6px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ── Info top (next to cover) ───────────────── */
  .info-top {
    display: flex; flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .card-bottom {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .meta-line {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    display: flex; align-items: center; flex-wrap: wrap;
  }
  .meta-album {
    font-size: 14px;
    letter-spacing: 0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }
  .title {
    margin: 0;
    font-size: clamp(28px, 3.8vw, 42px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* ── Embedded visualizer (full-width strip) ──── */
  .viz-embed {
    position: relative;
    width: 100%;
    height: 110px;
    overflow: hidden;
  }
  .viz-idle {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: space-around;
    padding: 0 4%;
  }
  .viz-idle span {
    flex: 1; margin: 0 1px;
    border-radius: 2px 2px 0 0;
  }

  /* ── Seek ───────────────────────────────────── */
  .seek-row { display: flex; align-items: center; gap: 12px; }
  .time {
    font-size: 11px;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    min-width: 42px;
  }
  .time:last-child { text-align: right; }
  .seek {
    flex: 1; height: 4px; border-radius: 999px;
    position: relative; cursor: pointer; touch-action: none;
  }
  .seek-fill {
    height: 100%; border-radius: 999px;
    transition: width 0.08s linear;
    pointer-events: none;
  }
  .seek-knob {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.12s;
    pointer-events: none;
  }
  .seek:hover .seek-knob { transform: translate(-50%, -50%) scale(1.15); }

  /* Buffering: an indeterminate sweep along the seek bar while the next bytes
     of a track are still arriving. Paired with the spinner on the play button. */
  .seek.buffering::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 999px;
    background-image: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
    background-size: 38% 100%;
    background-repeat: no-repeat;
    opacity: 0.55;
    animation: seek-sweep 1.3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes seek-sweep {
    0%   { background-position: -38% 0; }
    100% { background-position: 138% 0; }
  }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spin, .seek.buffering::after, .mini-wave span, .np-dot { animation: none; }
  }

  /* ── Controls ───────────────────────────────── */
  .controls { display: flex; align-items: center; gap: 14px; }
  .controls button {
    appearance: none; border: 0; background: transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.12s, opacity 0.15s, color 0.2s;
    padding: 6px;
  }
  .controls button:hover { transform: scale(1.08); }
  .ctrl-primary {
    width: 52px; height: 52px;
    margin: 0 6px;
  }
  .ctrl-primary:active { transform: scale(0.94); }
  .ctrl-secondary, .ctrl-tertiary { width: 32px; height: 32px; }

  /* ── Volume ─────────────────────────────────── */
  .vol {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
  }
  .vol-track {
    width: 90px; height: 4px;
    border-radius: 999px;
    position: relative;
    overflow: visible;
  }
  .vol-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--pct, 0%);
    border-radius: 999px;
    background: var(--fg);
    pointer-events: none;
    transition: width 0.08s linear;
  }
  .vol-track input[type=range] {
    -webkit-appearance: none; appearance: none;
    position: absolute;
    left: 0; top: -8px;
    width: 100%; height: 20px;
    background: transparent;
    margin: 0;
    padding: 0;
    cursor: pointer;
  }
  .vol-track input[type=range]::-webkit-slider-runnable-track {
    background: transparent; height: 20px; border: none;
  }
  .vol-track input[type=range]::-moz-range-track {
    background: transparent; height: 20px; border: none;
  }
  .vol-track input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    cursor: pointer;
    margin-top: 4px;
  }
  .vol-track input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    cursor: pointer;
  }

  /* ── Side panels (left = playlist, right = settings) ── */
  .side-panel {
    width: 0;
    overflow: hidden;
    opacity: 0;
    transition: width 0.42s cubic-bezier(.2,.8,.2,1), opacity 0.3s;
    flex-shrink: 0;
    display: flex; flex-direction: column;
    min-height: 0;
    contain: size;
  }
  .side-panel.side-open { width: 290px; opacity: 1; }
  .side-panel.left.side-open { order: -1; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .side-panel.side-open { width: 100%; max-height: 50vh; }
  }
  .sp-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 10px; flex-shrink: 0;
  }
  .sp-eyebrow { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; }
  .sp-x {
    appearance: none; border: 0; background: transparent;
    width: 22px; height: 22px; border-radius: 6px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .sp-x:hover { background: rgba(255,255,255,0.08); }
  .sp-body {
    flex: 1;
    min-height: 0;
    padding: 0 18px 18px;
    display: flex; flex-direction: column; gap: 22px;
    overflow-y: auto;
  }

  /* Playlist */
  .pl-actions {
    display: flex; gap: 6px;
    padding: 0 18px 12px; flex-shrink: 0;
  }
  .pl-btn {
    flex: 1; appearance: none; background: transparent;
    border: 0.5px solid; cursor: pointer;
    padding: 8px 10px; border-radius: 6px;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.15s;
  }
  .pl-btn:hover { background: rgba(255,255,255,0.04); }
  .pl-list {
    flex: 1; overflow-y: auto;
    padding: 0 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
    min-height: 0;
  }
  .pl-empty {
    padding: 28px 14px;
    font-size: 11px; letter-spacing: 0.06em;
    text-align: center; line-height: 1.7;
  }
  .pl-item {
    display: grid;
    grid-template-columns: 24px 36px 1fr auto;
    gap: 10px; align-items: center;
    padding: 7px 8px; border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .pl-item:hover { background: rgba(255,255,255,0.04); }
  .pl-num { font-size: 10px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; text-align: center; }
  .pl-thumb {
    width: 36px; height: 36px;
    border-radius: 4px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .pl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pl-info { min-width: 0; }
  .pl-title { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-sub {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pl-remove {
    appearance: none; border: 0; background: transparent;
    cursor: pointer;
    width: 22px; height: 22px; border-radius: 4px;
    opacity: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s, opacity 0.15s;
  }
  .pl-item:hover .pl-remove { opacity: 1; }
  .pl-remove:hover { background: rgba(255,255,255,0.06); }

  .set-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .set-group { display: flex; flex-direction: column; }

  .theme-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .theme-swatch {
    appearance: none; border: 1px solid;
    cursor: pointer;
    padding: 10px 6px 8px;
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform 0.12s, border-color 0.2s;
  }
  .theme-swatch:hover { transform: translateY(-1px); }
  .theme-swatch.on { border-width: 1.5px; }
  .ts-bars {
    display: flex; align-items: flex-end; gap: 2px;
    width: 100%; height: 26px;
  }
  .ts-bars span {
    flex: 1;
    border-radius: 1px;
    min-height: 4px;
  }
  .ts-name {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .set-row.vert {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .slider-head {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .set-row-label {
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .slider-track {
    width: 100%; height: 4px;
    border-radius: 999px;
    position: relative;
    margin: 6px 0 4px;
  }
  .slider-track::after {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--pct, 0%);
    border-radius: 999px;
    background: var(--fg);
    pointer-events: none;
  }
  .slider-track input[type=range] {
    -webkit-appearance: none; appearance: none;
    position: absolute;
    left: 0; top: -8px;
    width: 100%; height: 20px;
    background: transparent;
    margin: 0; padding: 0;
    cursor: pointer;
  }
  .slider-track input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    cursor: pointer;
    margin-top: 4px;
  }
  .slider-track input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    cursor: pointer;
  }

  .mini-toggle {
    appearance: none; border: 0;
    width: 32px; height: 18px;
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    padding: 0;
  }
  .mini-toggle i {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    transition: transform 0.18s;
  }
  .mini-toggle.on i { transform: translateX(14px); }

  /* ── About panel (drawer from the top) ──────── */
  .top-panel {
    width: min(1200px, 96vw);
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    margin-bottom: 0;
    flex-shrink: 0;
    display: flex; flex-direction: column;
    transition: max-height 0.42s cubic-bezier(.2,.8,.2,1), opacity 0.3s, margin-bottom 0.42s cubic-bezier(.2,.8,.2,1);
  }
  .top-panel.top-open { max-height: min(46vh, 400px); opacity: 1; margin-bottom: 14px; }
  .about-body {
    padding: 2px 18px 18px;
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 16px 28px;
    overflow-y: auto;
    min-height: 0;
  }
  .about-text {
    flex: 1 1 300px; min-width: 240px;
    margin: 0;
    font-size: 12px; line-height: 1.75; letter-spacing: 0.02em;
  }
  .about-links {
    flex: 1 1 300px; min-width: 240px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .about-group {
    display: flex; flex-direction: column;
    gap: 7px;
  }
  .about-group-row {
    display: flex; flex-wrap: wrap;
    gap: 6px 8px;
  }
  .about-group-label {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .about-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 6px;
    border: 0.5px solid;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none;
    transition: background 0.15s;
  }
  .about-chip:hover { background: rgba(255,255,255,0.05); }
  .about-chip svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }
  .about-note {
    margin: 0;
    font-size: 10px; line-height: 1.7; letter-spacing: 0.04em;
  }

  /* ── Footer ─────────────────────────────────── */
  .footer-caption {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
    white-space: nowrap;
  }
  .fc-dot {
    width: 5px; height: 5px; border-radius: 50%;
    transition: opacity 0.4s;
  }

  .err {
    font-size: 11px;
    letter-spacing: 0.04em;
    margin-top: -4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Production builds, and player.jsx is transpiled ahead of time by
     `npm run build` into player.js, so no in-browser Babel is shipped.
     defer keeps all four off the critical path and preserves execution order. -->
<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js" integrity="sha384-JpTt7qxVx1X/pHeYiCfqFdKRu2HF1MBGr1kEXtbNIGwwryGWMbbW78onU3bdkAHZ" crossorigin="anonymous"></script>
<script defer src="js/player.js"></script>

<script async src="js/analytics.js"></script>
</body>
</html>
