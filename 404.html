<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<!-- GitHub Pages serves this page for any missing path under the site, so
     relative URLs below would resolve against whatever path was requested.
     <base> pins them to the deploy root instead. Change it here if the site
     ever moves to a custom domain. -->
<base href="/audioptix/"/>

<title>Track not found, AudiOptix</title>
<meta name="description" content="That page is not in the queue. Head back to the AudiOptix player."/>
<meta name="robots" content="noindex"/>

<link rel="icon" href="favicon/favicon.ico" sizes="32x32"/>
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#0a0907"/>

<link rel="stylesheet" href="fonts/fonts.css"/>

<style>
  /* Noir palette, straight from THEMES.noir in player.jsx. */
  :root {
    --bg: #0a0907;
    --fg: #f4ede0;
    --dim: rgba(244, 237, 224, 0.55);
    --faint: rgba(244, 237, 224, 0.18);
    --accent: #e8c890;
    --bar-top: #f4ede0;
    --bar-bottom: #7a6a4f;
    --title-font: 'Cormorant Garamond', 'Times New Roman', serif;
    --meta-font: 'JetBrains Mono', ui-monospace, monospace;
    --body-font: 'Inter Tight', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .stage {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px;
    text-align: center;
    overflow: hidden;
  }
  .ambient {
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(60% 50% at 50% 60%, rgba(232, 200, 144, 0.10) 0%, transparent 70%);
  }
  .panel { position: relative; z-index: 2; max-width: 520px; }
  .mark { width: 64px; height: 64px; display: block; margin: 0 auto 26px; }
  .code {
    margin: 0;
    font-family: var(--title-font);
    font-style: italic; font-weight: 500;
    font-size: clamp(64px, 14vw, 104px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .eyebrow {
    margin: 14px 0 0;
    font-family: var(--meta-font);
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--dim);
  }
  .msg {
    margin: 18px 0 0;
    font-size: 13px; line-height: 1.75; letter-spacing: 0.02em;
    color: var(--dim);
  }
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 28px;
    padding: 10px 18px; border-radius: 6px;
    border: 0.5px solid var(--faint);
    font-family: var(--meta-font);
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg); text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .back:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--accent); }
  .back svg { width: 12px; height: 12px; }

  /* A frozen visualizer: the bars are here, the audio is not. */
  .bars {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 3px;
    height: 46px; width: min(320px, 70vw);
    margin: 34px auto 0;
  }
  .bars span {
    flex: 1;
    border-radius: 2px 2px 0 0;
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    opacity: 0.32;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="ambient" aria-hidden="true"></div>

  <main class="panel">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="AudiOptix">
      <rect width="32" height="32" rx="6" fill="#0a0907"/>
      <path transform="translate(5.30 0.03)" d="M19 7v12.2a4.3 4.3 0 1 1-2-3.6V10l-6 1.6v9.6a4.3 4.3 0 1 1-2-3.6V9l10-2.6z" fill="#e8c890"/>
    </svg>

    <p class="code">404</p>
    <p class="eyebrow">Track not found</p>
    <p class="msg">
      Nothing is queued at this address. The page may have been renamed, or the
      link may have picked up a typo along the way.
    </p>

    <a class="back" href=".">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
      </svg>
      Back to the player
    </a>

    <div class="bars" aria-hidden="true">
      <span style="height:18%"></span><span style="height:34%"></span><span style="height:26%"></span>
      <span style="height:52%"></span><span style="height:41%"></span><span style="height:68%"></span>
      <span style="height:47%"></span><span style="height:83%"></span><span style="height:61%"></span>
      <span style="height:95%"></span><span style="height:57%"></span><span style="height:74%"></span>
      <span style="height:44%"></span><span style="height:63%"></span><span style="height:38%"></span>
      <span style="height:49%"></span><span style="height:29%"></span><span style="height:36%"></span>
      <span style="height:22%"></span><span style="height:15%"></span>
    </div>
  </main>
</div>

<script async src="js/analytics.js"></script>
</body>
</html>
